# Telegraf: MQTT (local Mosquitto) -> InfluxDB v2 (local), Version 1.
#
# All the actual values come from environment variables set in
# docker-compose.yml / your .env — nothing here is hardcoded.

[agent]
  interval = "1s"
  flush_interval = "1s"

[[inputs.mqtt_consumer]]
  servers = ["tls://${MQTT_HOST}:8883"]
  topics = ["tukzie/telemetry"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  tls_ca = "/etc/telegraf/ca.crt"
  client_id = "telegraf-local"

  # Telemetry arrives as one flat JSON object (see gateway/schema.py's
  # TelemetryPacket.to_dict()). Telegraf's plain "json" parser turns
  # every top-level key into a field automatically, so if you add a new
  # sensor field in schema.py it shows up in InfluxDB with no changes
  # needed here.
  data_format = "json"
  name_override = "telemetry"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
